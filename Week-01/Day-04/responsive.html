<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Hamburger Menu</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
}

/* Navbar */
nav{
    background:#333;
    padding:10px;
}

/* Hide checkbox */
#menu-toggle{
    display:none;
}

/* Hamburger icon */
.menu-icon{
    font-size:24px;
    color:white;
    cursor:pointer;
    display:none;
}

/* Navigation links */
nav ul{
    list-style:none;
    display:flex;
    gap:20px;
    margin:0;
    padding:0;
}

nav ul li{
    color:white;
}

/* Page content */
.container{
    padding:20px;
}

/* Cards section */
.cards{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
}

.card{
    border:1px solid #ccc;
    padding:20px;
    flex:1 1 200px;
    border-radius:8px;
    background:#f5f5f5;
}

/* Mobile styles */
@media (max-width:768px){

    /* Show hamburger */
    .menu-icon{
        display:block;
    }

    /* Hide menu initially */
    nav ul{
        display:none;
        flex-direction:column;
        margin-top:10px;
    }

    /* Show menu when clicked */
    #menu-toggle:checked + .menu-icon + ul{
        display:flex;
    }

    /* Stack cards vertically */
    .cards{
        flex-direction:column;
    }
}
</style>
</head>
<body>

<nav>
    <input type="checkbox" id="menu-toggle">
    <label for="menu-toggle" class="menu-icon">☰ Menu</label>

    <ul>
        <li>Home</li>
        <li>About</li>
        <li>Services</li>
        <li>Contact</li>
    </ul>
</nav>

<!-- Body Content -->
<div class="container">
    <h1>Welcome to Our Website</h1>
    <p>This page demonstrates responsive design using a hamburger menu and flexible layout.</p>

    <div class="cards">
        <div class="card">
            <h3>Feature 1</h3>
            <p>Fast and responsive design.</p>
        </div>

        <div class="card">
            <h3>Feature 2</h3>
            <p>Mobile friendly navigation.</p>
        </div>

        <div class="card">
            <h3>Feature 3</h3>
            <p>Clean and simple layout.</p>
        </div>
    </div>
</div>

</body>
</html>
