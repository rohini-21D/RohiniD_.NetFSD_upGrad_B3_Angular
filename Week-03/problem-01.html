<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div { 
            margin-bottom: 15px;
        }
        label { 
            display: block; 
            margin-bottom: 5px; 
            font-weight: bold; 
        }
        input, select, textarea { 
            width: 100%; 
            padding: 8px; 
            box-sizing: border-box; 
        }
        button { 
            padding: 10px 15px; 
            background-color: #007BFF; 
            color: white; 
            border: none; 
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Feedback Form</h1>
    <hr>
    <form action="feedback.php" method="POST" id="feedbackForm">
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div>
            <label for="rating">Course Rating:</label>
            <select id="rating" name="rating">
                <option value="excellent">Excellent</option>
                <option value="good">Good</option>
                <option value="average">Average</option>
                <option value="poor">Poor</option>
            </select>
        </div>
        <div>
            <label for="comments">Comments:</label>
            <textarea id="comments" name="comments" rows="4"></textarea>
        </div>
        <div>
            <button id="btn1">Submit Feedback</button>
        </div>
    </form>

    <h1 id="message">

    </h1>
    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
    <script>
        $(document).ready(function(){
            $("#btn1").click(function(e){
                e.preventDefault();
                let name=$("#name").val();
                // alert(name);
                let email=$("#email").val();
                // alert(email);
                if(name=="" || email==""){
                    $("#message").text("Please enter a valid name and email").css("color","red");
                    return;
                }else{
                    $("#feedbackForm").hide();
                    $("#message").text("Feedback Submittes Succesfully..").css("color","green");
                }  
            })
        })
    </script>
</body>
</html>
