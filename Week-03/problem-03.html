<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
        }
        .navbar{
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: black;
            color: white;
            padding: 20px;
        }
        .container{
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            margin-top: 50px;
            height: 80vh;
        }
        #prod1,#prod2,#prod3,#prod4{
            /* border: 2px solid black; */
            width: 300px;
            height: 400px;
            border-radius: 10px;
            background-color:azure;
            text-align: center;
            padding: 20px;
        }
        div img{
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
        #btn{
            padding: 15px;
            background-color: beige;
            border: none;
            width: 150px;
            font-size: 15px;
            cursor: pointer;
            margin: 20px;
        }
        footer{
            padding: 20px;
            text-align: center;
            background-color: black;
            color: white;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>Gadget Store</h1>
        <h2>Cart : <span id="cartCount">0</span></h2>
    </div>
    <hr>
    <div class="container">
        <div id="prod1">
            <img src="https://cdsassets.apple.com/live/SZLF0YNV/images/sp/111339_sp818-mbp13touch-space-select-202005.png" alt="">
            <h3>Lapto</h3>
            <p>Lorem ipsum dolor sit amet.</p>
            <button id="btn">Add to Cart</button>
            <h4 class="msg"></h4>
        </div>
        <div id="prod2">
            <img src="https://darlingretail.com/cdn/shop/files/iPhone_15_Blue_Pure_Back_iPhone_15_Blue_Pure_Front_2up_Screen__WWEN_800x.jpg?v=1695103868" alt="">
            <h3>Iphone </h3>
            <p>Lorem ipsum dolor sit amet.</p>
            <button id="btn">Add to Cart</button>
            <h4 class="msg"></h4>
        </div>
        <div id="prod3">
            <img src="https://store.storeimages.cdn-apple.com/1/as-images.apple.com/is/airpods-4-select-202409_FV1?wid=976&hei=916&fmt=jpeg&qlt=90&.v=WnVKRVRUTFVsYThXaWkydWViL1Q3ZDZGTE9TV3RDcGJJclBqdUtzdTJYYjNHc3NlSmU2dzJyR1kxZEwyTE1neUJkRlpCNVhYU3AwTldRQldlSnpRa0NZZXAxWFNjRXhITDI1RVE5YVpyU0E" alt="">
            <h3>Airpodes</h3>
            <p>Lorem ipsum dolor sit amet.</p>
            <button id="btn">Add to Cart</button>
            <h4 class="msg"></h4>
        </div>
        <div id="prod4">
            <img src="https://store.storeimages.cdn-apple.com/1/as-images.apple.com/is/MNWP3_GEO_IN?wid=4982&hei=4000&fmt=jpeg&qlt=90&.v=1678377335734" alt="">
            <h3>Adaptor</h3>
            <p>Lorem ipsum dolor sit amet.</p>
            <button id="btn">Add to Cart</button>
            <h4 class="msg"></h4>
        </div>

        
    </div>

    <footer>
        <h4>My Website &copy; 2026</h4>
    </footer>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>

        $(document).ready(function(){
            let cartCount=0;
            $(".container").on("click","#btn",function(){
                cartCount++;
                $("#cartCount").text(cartCount);

                $(this).prop("disabled",true);
                $(this).attr("title","Already Added");

                $(this).siblings(".msg").text("Added to Cart");
            })
        })
    </script>
</body>
</html>
