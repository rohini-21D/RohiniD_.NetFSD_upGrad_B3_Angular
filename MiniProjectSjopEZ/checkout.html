<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOP-EZ E-commerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="CSS/style.css">
    
</head>
<body class="d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar navbar-expand-lg custom-navbar navbar-dark fixed-top">
            
            <div class="container">
                
                <!-- Logo + Name -->
                <a class="navbar-brand d-flex align-items-center" href="index.html">
                    <img src="Images/shopEZ-logo.png" alt="ShopEZ Logo" class="logo-img" width="60" height="60">
                    <span class="ms-2 fw-bold fs-4 text-white">ShopEZ</span>
                </a>
                
                <!-- Mobile Toggle Button -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                
                <!-- Navigation Links -->
                <div class="collapse navbar-collapse" id="navbarNav">
                    
                    <ul class="navbar-nav ms-auto">
                        
                        <li class="nav-item">
                            <a class="nav-link text-white" href="index.html">Home</a>
                        </li>
                        
                        <li class="nav-item">
                            <a class="nav-link text-white" href="products.html">Products</a>
                        </li>
                        
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle text-white" href="#" data-bs-toggle="dropdown">Categories</a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="products.html?category=Electronics">Electronics</a></li>
                                <li><a class="dropdown-item" href="products.html?category=Fashion">Fashion</a></li>
                                <li><a class="dropdown-item" href="products.html?category=Home">Home</a></li>
                            </ul>
                        </li>
                        
                        <li class="nav-item">
                            <a class="nav-link text-white" href="cart.html">Cart</a>
                        </li>
                        
                    </ul>
                    
                </div>
                
            </div>
            
        </nav>
    </header>
    
    <section>
        <div class="container mt-4">
            <h1 class="text-center">Checkout</h1>

            <div id="checkoutContent"> 
                
                <div id="orderSummary"></div>
                
                <h3>Total ₹<span id="orderTotal">0</span></h3>
                
                <form id="checkoutForm" class="mt-4">
                    <div class="mb-3">
                        <label class="form-label">Name </label>
                        <input type="text" id="name" class="form-control" placeholder="Enetr Your Name..." required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Email </label>
                        <input type="email" id="email" class="form-control" placeholder="Enetr Your email..." required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Mobile Number </label>
                        <input type="tel" pattern="[0-9]{10}" id="number" class="form-control" placeholder="Enetr a mobile Number.." required >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Address </label>
                        <input type="text" id="address" class="form-control" placeholder="Enterr Your address..." required>
                    </div>
                    
                    <button type="submit" class="btn btn-success">Place Order</button>
                </form>
                
            </div>
            
            <div id="successMsg" class="text-center mt-5" style="display: none;">
                <h2 class="text-success"> Hurray! Your order placed successfully</h2>
                <a href="index.html" class="btn btn-primary mt-3">Continue Shopping</a>
            </div>
            
        </div>

    </section>
    
    <footer class="bg-dark text-white text-center p-3 mt-auto">
        <p>&copy; 2026 ShopEZ | All Rights Reserved</p>
    </footer>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
    <script src="JS/checkout.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
