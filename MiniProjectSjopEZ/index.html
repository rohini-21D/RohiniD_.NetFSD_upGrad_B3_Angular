<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOP-EZ E-commerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="CSS/style.css">
    
</head>
<body class="d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar navbar-expand-lg custom-navbar navbar-dark fixed-top">
            
            <div class="container">
                
                <!-- Logo + Name -->
                <a class="navbar-brand d-flex align-items-center" href="index.html">
                    <img src="Images/shopEZ-logo.png" alt="ShopEZ Logo" class="logo-img" width="60" height="60">
                    <span class="ms-2 fw-bold fs-4 text-white">ShopEZ</span>
                </a>
                
                <!-- Mobile Toggle Button -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                
                <!-- Navigation Links -->
                <div class="collapse navbar-collapse" id="navbarNav">
                    
                    <ul class="navbar-nav ms-auto">
                        
                        <li class="nav-item">
                            <a class="nav-link text-white" href="index.html">Home</a>
                        </li>
                        
                        <li class="nav-item">
                            <a class="nav-link text-white" href="products.html">Products</a>
                        </li>
                        
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle text-white" href="#" data-bs-toggle="dropdown">Categories</a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="products.html?category=Electronics">Electronics</a></li>
                                <li><a class="dropdown-item" href="products.html?category=Fashion">Fashion</a></li>
                                <li><a class="dropdown-item" href="products.html?category=Home">Home</a></li>
                            </ul>
                        </li>
                        
                        <li class="nav-item">
                            <a class="nav-link text-white" href="cart.html">Cart( <span id="cartCount">0</span>)</a>
                        </li>
                        
                    </ul>
                    
                </div>
                
            </div>
            
        </nav>
    </header>
    <div id="homeCarousel" class="carousel slide mt-2" data-bs-ride="carousel" data-bs-interval="2000" data-bs-pause="false">
        
        <!-- Indicators -->
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#homeCarousel" data-bs-slide-to="0" class="active"></button>
            <button type="button" data-bs-target="#homeCarousel" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#homeCarousel" data-bs-slide-to="2"></button>
        </div>
        
        <!-- Images -->
        <div class="carousel-inner">
            
            <div class="carousel-item active">
                <img src="Images/coffeemaker(5).jpg" class="d-block w-100 carousel-img">
            </div>
            
            <div class="carousel-item">
                <img src="Images/headphones(1).jpg" class="d-block w-100 carousel-img">
            </div>
            
            <div class="carousel-item">
                <img src="Images/Laptop.jpg" class="d-block w-100 carousel-img">
            </div>
            
        </div>
        
        <!-- Controls -->
        <button class="carousel-control-prev" type="button" data-bs-target="#homeCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        
        <button class="carousel-control-next" type="button" data-bs-target="#homeCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
        
    </div>
    
    <section class="container mt-5 pt-4">
        <h1 class="text-center mb-4 fw-bold">Featured Products</h1>

        <div class="row g-4 mb-5" id="featuredProducts">

        </div>
    </section> 

    <footer class="bg-dark text-white text-center p-3 mt-auto">
        <p>&copy; 2026 ShopEZ | All Rights Reserved</p>
    </footer>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/products.js"></script>
    <script src="js/common.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
