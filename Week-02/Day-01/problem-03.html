<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            text-align: center;
            background-color:bisque;
        }
    </style>
</head>
<body>
    <h1>Location-Based Weather Logger </h1>
    <hr>
    <input type="text" id="userloc" placeholder="Enter Yoour Location">
    <button onclick="getLocation()">Get My Location</button>

    <div id="result"></div>
    <div id="history"></div>
    <script>
        function getLocation(){

            let result=document.getElementById("result");

            let userLoc=document.getElementById("userloc").value;
            // console.log(userLoc);

            navigator.geolocation.getCurrentPosition(fn_names);

            function fn_names(args){
               var lat= args.coords.latitude;
            //    console.log(lat);
               var lon= args.coords.longitude;
               result.innerHTML=`
               <h3>Long: ${userLoc}</h3>
               Latitude: ${lat} <br>;
               Longitude: ${lon}
                `;

                let locations=JSON.parse(localStorage.getItem("locations")) || [];

                locations.push({
                    place:userLoc,
                    latitude:lat,
                    longitude:lon
                });

                localStorage.setItem("locations",JSON.stringify(locations));

            }

            
        }
    </script>
</body>
</html>
