<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .button{
            text-align: center;
        }
    </style>
</head>
<body>
    <h1 align="center">Location-Based Weather Logger</h1>
    <hr>
    <div class="button">
        <button onclick="locationButton()">Get My Location</button>
    </div>
    <p id="p1"></p>
    <script>
    
    function  locationButton()
		{
            navigator.geolocation.getCurrentPosition(fn_display); 
		}		
		
		function fn_display( args )
		{
			var x = args.coords.latitude;
			var y = args.coords.longitude;
		
	        var  str  = "Latitude	: " + x;
			str +="<br>";
		    str += "Longitude : " + y; 
		
            var obj = document.getElementById("p1");
			obj.innerHTML = str;
		}	 
		</script>	
    </script>
</body>
</html>
