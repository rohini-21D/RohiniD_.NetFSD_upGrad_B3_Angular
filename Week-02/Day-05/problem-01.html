<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Event Dashboard</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        
        body{
            background:#f4f6fb;
            font-family:Arial, Helvetica, sans-serif;
        }
        .brand{
            font-size: 30px;
        }
        .sidebar{
            background:#1e293b;
            min-height:100vh;
        }
        .sidebar a{
            display:block;
            padding:12px 15px;
            color:#cbd5e1;
            text-decoration:none;
        }
        .sidebar a:hover{
            background:#334155;
            color:white;
        }

        .card{
            border:none;
            border-radius:10px;
            box-shadow:0 3px 10px rgba(0,0,0,0.1);
        }
        
        footer{
            background:#0f172a;
            color:white;
            text-align:center;
            padding:15px;
        }
        
    </style>
</head>

<body>
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark p-5">
        <div class="container-fluid justify-content-center">
            
            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#sidebarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <a class="navbar-brand brand">College Event Management Dashboard</a>
            
        </div>
    </nav>
    

    <div class="container-fluid">
        <div class="row">
            
            <div class="col-lg-2 col-md-3 sidebar collapse show" id="sidebarMenu">
                <h5 class="text-white text-center mt-3">School Panel</h5>
                
                <a href="#">Dashboard</a>
                <a href="#">Events</a>
                <a href="#">Students</a>
                <a href="#">Teachers</a>
                <a href="#">Departments</a>
                <a href="#">Results</a>
                <a href="#">Settings</a>
            </div>
            
        
            <div class="col-lg-10 col-md-9 p-4">
                
                <h3 class="mb-4">Upcoming Events</h3>
                
                <div class="row g-4">
                    
                    <div class="col-xl-3 col-lg-4 col-md-6">
                        <div class="card p-3">
                            <h5>Science Fair</h5>
                            <p>Date: May 10</p>
                            <button class="btn btn-primary btn-sm">View</button>
                        </div>
                    </div>
                    
                    <div class="col-xl-3 col-lg-4 col-md-6">
                        <div class="card p-3">
                            <h5>Sports Day</h5>
                            <p>Date: June 2</p>
                            <button class="btn btn-success btn-sm">View</button>
                        </div>
                    </div>
                    
                    <div class="col-xl-3 col-lg-4 col-md-6">
                        <div class="card p-3">
                            <h5>Annual Day</h5>
                            <p>Date: July 15</p>
                            <button class="btn btn-warning btn-sm">View</button>
                        </div>
                    </div>
                    
                    <div class="col-xl-3 col-lg-4 col-md-6">
                        <div class="card p-3">
                            <h5>Tech Fest</h5>
                            <p>Date: Aug 20</p>
                            <button class="btn btn-info btn-sm">View</button>
                        </div>
                    </div>
                    
                </div>
                
                <div class="mt-5">
                    <button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#eventModal">
                        Add Event
                    </button>
                </div>
                
            </div>
        </div>
    </div>
    
    <footer class="p-4">
        College Event Management System &copy; 2026
    </footer>
    
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
</body>
</html>
