<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Landing Page</title>
   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style> 
        body{
            background-color:#f8f9fa;
        }
        
        .hero{
            background:linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)),
            url("https://images.unsplash.com/photo-1512436991641-6745cdb1723f");
            background-size:cover;
            background-position:center;
            color:white;
            height:80vh;
            display:flex;
            align-items:center;
            justify-content:center;
            text-align:center;
        }
        
        .product-card img{
            height: 220px;      
            width: 100%;
            object-fit: cover;  
        }
        .product-card:hover{
            transform:scale(1.03);
            transition:0.3s;
        }

    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">ShopZone</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse d-none d-lg-block">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#products">Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>
    
    <div class="offcanvas offcanvas-start" id="menu">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title">Menu</h5>
            <button class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="#products">Products</a></li>
                <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
            </ul>
        </div>
    </div>
    
    
    <section class="hero">
        <div>
            <h1 class="display-4 fw-bold">Welcome to ShopZone</h1>
            <p>Best Deals on Trendy Products</p>
            <button class="btn btn-light btn-lg">Shop Now</button>
        </div>
    </section>
    
    
    <section class="container my-5">
        <h2 class="text-center mb-4">Featured Products</h2>
        
        <div id="productCarousel" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">
                
                <div class="carousel-item active">
                    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30" class="d-block w-100" style="height:400px; object-fit:cover;">
                </div>
                
                <div class="carousel-item">
                    <img src="https://ecommercephotographyindia.com/assets/img/gallery/amplifier-ecommerce-photography.jpg" class="d-block w-100" style="height:400px; object-fit:cover;">
                </div>
                
                <div class="carousel-item">
                    <img src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f" class="d-block w-100" style="height:400px; object-fit:cover;">
                </div>
                
            </div>
            
            <button class="carousel-control-prev" type="button" data-bs-target="#productCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            
            <button class="carousel-control-next" type="button" data-bs-target="#productCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
            
        </div>
    </section>
    
  
    <section id="products" class="container my-5">
        <h2 class="text-center mb-4">Our Products</h2>
        
        <div class="row g-4">
            
            <div class="col-md-4">
                <div class="card product-card">
                    <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f" class="card-img-top">
                    <div class="card-body text-center">
                        <h5 class="card-title">Camera</h5>
                        <p>$299</p>
                        <button class="btn btn-primary">Buy Now</button>
                    </div>
                </div>
            </div>
            
            <div class="col-md-4 ">
                <div class="card product-card">
                    <img src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8" class="card-img-top">
                    <div class="card-body text-center">
                        <h5 class="card-title">Laptop</h5>
                        <p>$899</p>
                        <button class="btn btn-primary">Buy Now</button>
                    </div>
                </div>
            </div>
            
            <div class="col-md-4 ">
                <div class="card product-card">
                    <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9" class="card-img-top">
                    <div class="card-body text-center">
                        <h5 class="card-title">Mobile</h5>
                        <p>$499</p>
                        <button class="btn btn-primary">Buy Now</button>
                    </div>
                </div>
            </div>
            
        </div>
    </section>
    
    
    <section class="bg-primary text-white py-5 " id="contact">
        <div class="container text-center">
            <h3>Subscribe to our Newsletter</h3>
            <form class="row justify-content-center mt-3">
                <div class="col-md-4">
                    <input type="email" class="form-control" placeholder="Enter your email">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-light w-100">Subscribe</button>
                </div>
            </form>
        </div>
    </section>
    
   
    <footer class="bg-dark text-white text-center p-3" >
        <p>© 2026 ShopZone. All rights reserved.</p>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
</body>
</html>
