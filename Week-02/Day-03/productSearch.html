<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Search</title>
    
    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f3f3f3;
            margin:0;
            padding:20px;
        }
        
        .container{
            max-width:1000px;
            margin:auto;
        }
        
        h2{
            text-align:center;
            margin-bottom:20px;
        }
        
        .search-box{
            display:flex;
            margin-bottom:25px;
        }
        
        .search-box input{
            flex:1;
            padding:12px;
            border:1px solid #ccc;
            border-radius:6px 0 0 6px;
        }
        
        .search-box button{
            padding:12px 20px;
            border:none;
            background:#ff9900;
            color:white;
            cursor:pointer;
            border-radius:0 6px 6px 0;
        }
        
        #productList{
            display:grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap:20px;
        }
        
        .product{
            background:white;
            border-radius:8px;
            padding:15px;
            text-align:center;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
            transition:0.2s;
        }
        
        .product img{
            width:100%;
            height:150px;
            object-fit:contain;
        }
        
        .product-name{
            font-weight:bold;
            margin:10px 0;
        }
        
        .price{
            color:#B12704;
            font-weight:bold;
        }
        
        .buy-btn{
            margin-top:10px;
            background:#ffd814;
            border:none;
            padding:8px 12px;
            cursor:pointer;
            border-radius:4px;
        }
        
        .no-result{
            text-align:center;
            color:red;
            font-weight:bold;
        }
    </style>
</head>

<body>
    
    <div class="container">
        
        <h2>Product Search</h2>
        
        <div class="search-box">
            <input type="text" id="searchBox" placeholder="Search products...">
            <button id="searchBtn">Search</button>
        </div>
        
        <div id="productList"></div>
        
    </div>
    
    <script>
        
        
        const products = [
            {name:"Laptop", price:55000, img:"https://png.pngtree.com/png-vector/20250522/ourmid/pngtree-modern-laptop-computer-with-screen-open-technology-digital-device-png-image_16345445.png"},
            {name:"Mobile Phone", price:20000 , img:"https://www.livemint.com/lm-img/img/2023/12/06/optimize/oneplus_hh_1696660207538_1701840795336.png"},
            {name:"Headphones", price:3000, img:"https://m.media-amazon.com/images/I/51ZP90nPvoL.jpg"},
            {name:"Smart Watch", price:5000,img:"https://assets.entrepreneur.com/content/3x2/2000/1591261755-Header.jpg?format=pjeg&auto=webp&crop=4:3"},
            {name:"Keyboard", price:1500,img:"https://cdn1.smartprix.com/rx-ifuo3FISG-w280-h280/live-tech-cuppa-wire.webp"},
            {name:"Mouse", price:800,img:"https://media.istockphoto.com/id/184370848/photo/modern-pc-mouse-from-above-on-white.jpg?s=612x612&w=0&k=20&c=akaNUET2qDPmKtUdwP23M08nqd0M8jdEar3p8IW7mYk="}
        ];
        
    
        const searchBox = document.getElementById("searchBox");
        const searchBtn = document.getElementById("searchBtn");
        const productList = document.getElementById("productList");
        
        searchBtn.addEventListener("click", filterProducts);
        
        productList.addEventListener("click", handleProductClick);

        displayProducts(products);
        
        
        
        function displayProducts(productArray){
            
            productList.innerHTML = "";
            
            if(productArray.length === 0){
                productList.innerHTML = `<p class="no-result">No Results Found</p>`;
                return;
            }
            
            productArray.forEach(product => {
                
                const card = document.createElement("div");
                card.classList.add("product");
                
                card.innerHTML = `
                <img src="${product.img}">
                <div class="product-name">${product.name}</div>
                <div class="price">₹${product.price}</div>
                <button class="buy-btn">View Product</button>
                `;
                
                productList.appendChild(card);
                
            });
            
        }
        
        
        
        function filterProducts(){
            const searchValue = searchBox.value.toLowerCase();
            
            const filteredProducts = products.filter(product =>
            product.name.toLowerCase().includes(searchValue));
            displayProducts(filteredProducts);
        }

        function handleProductClick(e){
        
            if(e.target.classList.contains("buy-btn")){
                const productCard = e.target.closest(".product");
                const productName = productCard.querySelector(".product-name").innerText;
            
                alert("Opening product: " + productName);
            }
        
        }
    
    </script>

</body>
</html>
